<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Django Tarot{% endblock %}</title>
    <style>

html, body {
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    flex-direction: column;
    background-color: #1a1a2e;
    color: #e94560;
    font-family: 'Segoe UI', sans-serif;
}

.content {
    flex: 1 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}

footer {
    flex-shrink: 0;
    background: #16213e;
    color: #fff;
    text-align: center;
    padding: 20px;
    width: 100%;
    border-top: 1px solid #e94560;
}
    </style>
    
</head>
<body>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 Django Tarot Project | Developed by a mystic IT Specialist</p>
    </footer>
</body>
</html>
