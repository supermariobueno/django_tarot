{% extends 'deck/base.html' %}

{% block title %}Login | Mellow Tarot{% endblock %}

{% block content %}
<div class="card-container" style="max-width: 400px; margin: auto;">
    <h2>Enter your Temple</h2>
    <p style="font-style: italic; font-size: 0.9em; color: #ccc;">"Identify yourself to talk to the Arcana."</p>
    
    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        
        <div style="text-align: left; margin-bottom: 20px;">
            {{ form.as_p }}
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer;">
            UNLOCK YOUR FATE
        </button>
    </form>
    
    <p style="margin-top: 20px; font-size: 0.8em;">
        Forgot your password? <a href="#" style="color: #ffd700;">Click here</a>
    </p>
</div>
{% endblock %}
